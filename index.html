<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111814"><title>C/G Fantasy Real Estate League</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{--dark:#111814;--green:#18c96e;--light:#eaf8f0;--line:#dfe5e1;--muted:#66706a;--bg:#f6f8f7;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--dark)}main{max-width:780px;margin:auto;padding:16px 14px 80px}.hero{background:var(--dark);color:#fff;border-radius:20px;padding:18px}.hero h1{font-size:22px;margin:0 0 4px}.hero p{margin:0;color:#cdd5d0}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}.auth input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;margin:5px 0;font-size:16px}.primary,.secondary{border:0;border-radius:12px;padding:12px 14px;font-weight:800;font-size:15px}.primary{background:var(--green);color:var(--dark)}.secondary{background:#eef2ef}.authBtns{display:flex;gap:8px;margin-top:8px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.tab{padding:12px;border:1px solid var(--line);background:#fff;border-radius:12px;font-weight:800}.tab.active{background:var(--dark);color:#fff}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.score{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.score small{display:block;color:var(--muted);font-weight:700;font-size:11px}.score strong{font-size:25px}.section{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.section h2{font-size:14px;margin:0;padding:13px 14px;background:#eef2ef}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 12px;border-top:1px solid var(--line)}.name{font-weight:650}.pts{font-size:12px;color:var(--muted);margin-top:2px}.controls{display:flex;align-items:center;gap:7px}.qty{min-width:30px;text-align:center;font-weight:800;font-size:18px}.btn{width:44px;height:44px;border:0;border-radius:12px;font-size:24px;font-weight:800;background:var(--light)}.btn.plus{background:var(--green)}.leader{width:100%;border-collapse:collapse}.leader th,.leader td{text-align:left;padding:11px 7px;border-bottom:1px solid var(--line)}.leader th{font-size:12px;color:var(--muted)}.right{text-align:right!important}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}.msg{margin-top:8px;font-size:13px}.danger{color:#b42318}.good{color:#087443}@media(max-width:480px){.scores{grid-template-columns:repeat(3,1fr)}.score{padding:10px}.score strong{font-size:21px}.row{grid-template-columns:minmax(0,1fr) auto}}</style></head><body><main>
<div class="hero"><h1>🏈 C/G Fantasy Real Estate League</h1><p>Draft a team. Score each week. Win together.</p></div>
<section id="auth" class="card auth"><h2 style="margin-top:0">Sign in or create your account</h2><input id="name" placeholder="Display name (for sign up)"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><div class="authBtns"><button class="primary" id="signin">Sign In</button><button class="secondary" id="signup">Create Account</button></div><div id="authMsg" class="msg muted"></div></section>
<div id="app" class="hidden"><div class="topline"><div><strong id="welcome">My Tracker</strong><div class="muted">Points save to your account automatically.</div></div><button class="secondary" id="signout">Sign Out</button></div>
<div class="tabs"><button class="tab active" data-tab="tracker">My Tracker</button><button class="tab" data-tab="leaderboard">Leaderboard</button></div>
<section id="tracker"><div class="scores"><div class="score"><small>TODAY</small><strong id="todayScore">0</strong></div><div class="score"><small>THIS WEEK</small><strong id="weekScore">0</strong></div><div class="score"><small>SEASON</small><strong id="seasonScore">0</strong></div></div><div id="sections"></div></section>
<section id="leaderboard" class="card hidden"><h2 style="margin-top:0">League Leaderboard</h2><table class="leader"><thead><tr><th>#</th><th>Agent</th><th class="right">Today</th><th class="right">Week</th><th class="right">Season</th></tr></thead><tbody id="leaderRows"></tbody></table></section></div>
</main><script>
const SUPABASE_URL='https://pruvydksuuazckyttvnq.supabase.co';
const SUPABASE_KEY='sb_publishable_KyNM7mzl5JX5p6i1jUsibA_d5-8Seg9';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const activities=[
['Deals + Everyday Plays','Double-sided closing',20],['Deals + Everyday Plays','Closing: buyer side',10],['Deals + Everyday Plays','Closing: listing side',10],['Deals + Everyday Plays','New listing signed',6],['Deals + Everyday Plays','Property under contract',6],['Deals + Everyday Plays','Buyer agreement signed',3],['Deals + Everyday Plays','Price reduction obtained',2],['Deals + Everyday Plays','Open house held',2],['Deals + Everyday Plays','New 5-star client review',3],['Deals + Everyday Plays','Training or sales meeting',1],
['Referrals + Closing Bonuses','Sphere referral to CG agent',3],['Referrals + Closing Bonuses','Sphere referral under contract',5],['Referrals + Closing Bonuses','Sphere referral closes',10],['Referrals + Closing Bonuses','Closing bonus: $500K+',3],['Referrals + Closing Bonuses','Closing bonus: $750K+',5],['Referrals + Closing Bonuses','Closing bonus: $1M+',10],['Referrals + Closing Bonuses','Double-end closing bonus',5],['Referrals + Closing Bonuses','SkySlope complete before closing',3],
['Social Media','Social media post',2],['Social Media','Reel or short video',3],['Social Media','Story series: 3+ frames',1],['Social Media','Live video or virtual tour',3],['Social Media','Reel: 1,000–2,499 views',2],['Social Media','Reel: 2,500–4,999 views',4],['Social Media','Reel: 5,000+ views',6],['Social Media','Qualified social media lead',5],['Social Media','Appointment from social media',8],
['Hosted Events','Host client/community event',5],['Hosted Events','Qualified event referral',3],['Hosted Events','Event-sourced deal under contract',10],
['Team Bonus Plays','Everyone scores in the week',5],['Team Bonus Plays','Everyone scores in the month',15],['Team Bonus Plays','3+ members close in the month',10]];
let user=null, entries=[];
function localDate(){const d=new Date();const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function buildRows(){const cats=[...new Set(activities.map(a=>a[0]))],wrap=document.getElementById('sections');wrap.innerHTML='';cats.forEach(cat=>{const s=document.createElement('section');s.className='section';s.innerHTML=`<h2>${cat}</h2>`;activities.forEach((a,i)=>{if(a[0]!==cat)return;const r=document.createElement('div');r.className='row';r.innerHTML=`<div><div class="name">${a[1]}</div><div class="pts">+${a[2]} points each</div></div><div class="controls"><button class="btn" data-minus="${i}">−</button><span class="qty" data-q="${i}">0</span><button class="btn plus" data-plus="${i}">+</button></div>`;s.appendChild(r)});wrap.appendChild(s)})}
function todayQty(i){const a=activities[i];return entries.filter(e=>e.entry_date===localDate()&&e.activity===a[1]&&e.category===a[0]&&e.points===a[2]).reduce((s,e)=>s+e.quantity,0)}
function render(){let today=0,season=0;entries.forEach(e=>{const v=e.points*e.quantity;season+=v;if(e.entry_date===localDate())today+=v});const now=new Date(),day=(now.getDay()+6)%7,start=new Date(now);start.setHours(0,0,0,0);start.setDate(now.getDate()-day);let week=entries.filter(e=>new Date(e.entry_date+'T00:00:00')>=start).reduce((s,e)=>s+e.points*e.quantity,0);todayScore.textContent=today;weekScore.textContent=week;seasonScore.textContent=season;document.querySelectorAll('[data-q]').forEach(el=>el.textContent=todayQty(+el.dataset.q))}
async function loadEntries(){const {data,error}=await db.from('point_entries').select('*').eq('user_id',user.id).order('created_at');if(error)return alert(error.message);entries=data||[];render()}
async function change(i,delta){const a=activities[i],date=localDate();const matches=entries.filter(e=>e.entry_date===date&&e.activity===a[1]&&e.category===a[0]&&e.points===a[2]);const qty=matches.reduce((s,e)=>s+e.quantity,0);if(delta>0){const {error}=await db.from('point_entries').insert({user_id:user.id,activity:a[1],category:a[0],points:a[2],quantity:1,entry_date:date});if(error)return alert(error.message)}else{if(qty<=0)return;const last=matches[matches.length-1];const {error}=await db.from('point_entries').delete().eq('id',last.id).eq('user_id',user.id);if(error)return alert(error.message)}await loadEntries();}
async function loadLeaderboard(){const {data,error}=await db.from('leaderboard').select('*').order('season_points',{ascending:false});if(error)return alert(error.message);leaderRows.innerHTML=(data||[]).map((r,i)=>`<tr><td>${i+1}</td><td><strong>${r.display_name}</strong></td><td class="right">${r.today_points}</td><td class="right">${r.week_points}</td><td class="right"><strong>${r.season_points}</strong></td></tr>`).join('')||'<tr><td colspan="5">No scores yet.</td></tr>'}
async function showSession(){const {data:{session}}=await db.auth.getSession();user=session?.user||null;auth.classList.toggle('hidden',!!user);app.classList.toggle('hidden',!user);if(user){const {data:p}=await db.from('profiles').select('display_name').eq('id',user.id).single();welcome.textContent=p?.display_name||user.email;await loadEntries();await loadLeaderboard()}}
signup.onclick=async()=>{authMsg.textContent='Creating account…';const {error}=await db.auth.signUp({email:email.value.trim(),password:password.value,options:{data:{display_name:name.value.trim()||email.value.split('@')[0]}}});authMsg.textContent=error?error.message:'Account created. Signing you in…';authMsg.className='msg '+(error?'danger':'good');if(!error)await showSession()};
signin.onclick=async()=>{authMsg.textContent='Signing in…';const {error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});authMsg.textContent=error?error.message:'';authMsg.className='msg danger';if(!error)await showSession()};
signout.onclick=async()=>{await db.auth.signOut();await showSession()};
document.addEventListener('click',e=>{if(e.target.dataset.plus!==undefined)change(+e.target.dataset.plus,1);if(e.target.dataset.minus!==undefined)change(+e.target.dataset.minus,-1);if(e.target.dataset.tab){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===e.target));tracker.classList.toggle('hidden',e.target.dataset.tab!=='tracker');leaderboard.classList.toggle('hidden',e.target.dataset.tab!=='leaderboard');if(e.target.dataset.tab==='leaderboard')loadLeaderboard()}});
buildRows();db.auth.onAuthStateChange(()=>showSession());showSession();
</script></body></html>
