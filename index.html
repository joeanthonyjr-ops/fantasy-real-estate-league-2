<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111814"><title>C/G Fantasy Real Estate League</title>
<style>:root{--dark:#111814;--green:#18c96e;--line:#dfe5e1;--muted:#66706a;--bg:#f6f8f7;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--dark)}main{max-width:780px;margin:auto;padding:16px 14px 80px}.hero{background:var(--dark);color:#fff;border-radius:20px;padding:18px}.hero h1{font-size:22px;margin:0 0 4px}.hero p{margin:0;color:#cdd5d0}.card,.section{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}.auth input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;margin:5px 0;font-size:16px}.primary,.secondary,.btn,.tab{border:0;border-radius:11px;padding:11px 14px;font-weight:700;cursor:pointer}.primary,.plus,.tab.active{background:var(--green);color:#062b18}.secondary,.btn,.tab{background:#edf1ef;color:var(--dark)}button:disabled{opacity:.55;cursor:not-allowed}.authBtns,.topline,.tabs,.controls{display:flex;gap:8px;align-items:center}.authBtns{margin-top:8px}.msg{margin-top:10px;font-size:14px;min-height:20px}.muted{color:var(--muted)}.danger{color:#b42318}.good{color:#087a43}.hidden{display:none!important}.topline{justify-content:space-between;flex-wrap:wrap}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.score{background:#eef7f2;border-radius:14px;padding:12px;text-align:center}.score b{font-size:24px;display:block}.tabs{margin-top:14px}.tab{flex:1}.section{padding:0;overflow:hidden}.section h2{font-size:16px;margin:0;padding:14px 16px;background:#f0f5f2}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid #edf0ee}.name{font-weight:650}.pts{font-size:12px;color:var(--muted);margin-top:2px}.btn{font-size:20px;min-width:42px;padding:7px 10px}.qty{min-width:24px;text-align:center;font-weight:800}.leader{width:100%;border-collapse:collapse}.leader th,.leader td{padding:10px 6px;border-bottom:1px solid #eee;text-align:left}.right{text-align:right!important}
.historyNav,.filters,.entryActions{display:flex;gap:8px;align-items:center}.historyNav{justify-content:space-between;flex-wrap:wrap}.filters{margin-top:10px}.field{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}.day{margin-top:12px;border:1px solid var(--line);border-radius:14px;overflow:hidden}.dayHead{padding:10px 12px;background:#f0f5f2;font-weight:800;display:flex;justify-content:space-between}.entry{padding:11px 12px;border-top:1px solid #eee;display:flex;justify-content:space-between;gap:10px;align-items:center}.entryMeta{font-size:12px;color:var(--muted);margin-top:3px}.mini{border:0;border-radius:9px;padding:8px 10px;font-weight:700;cursor:pointer;background:#edf1ef}.dangerBtn{background:#feeceb;color:#b42318}.empty{padding:18px;text-align:center;color:var(--muted)}.teamCard{border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden}.teamHead{padding:12px;background:#f0f5f2;display:flex;justify-content:space-between;font-weight:800}.agentLine{padding:10px 12px;border-top:1px solid #eee;display:flex;justify-content:space-between}.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.modalBox{background:#fff;width:min(480px,100%);border-radius:18px;padding:18px}.modalBtns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}@media(max-width:520px){main{padding:10px 9px 70px}.hero{border-radius:14px}.card,.section{border-radius:14px}.row{padding:12px 11px}.scores{gap:5px}.score{padding:9px 4px}.score b{font-size:21px}}</style></head><body><main>
<header class="hero"><h1>🏈 C/G Fantasy Real Estate League</h1><p>Draft a team. Score each week. Win together.</p></header>
<section id="authBox" class="card auth"><h2 style="margin-top:0">Sign in or create your account</h2><input id="displayName" placeholder="Display name (for sign up)"><input id="emailInput" type="email" placeholder="Email" autocomplete="email"><input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password"><div class="authBtns"><button class="primary" id="signinBtn">Sign In</button><button class="secondary" id="signupBtn">Create Account</button></div><div id="authMsg" class="msg muted">Ready.</div></section>
<div id="app" class="hidden"><section class="card"><div class="topline"><div>Welcome, <strong id="welcome">Agent</strong><div id="teamLabel" class="muted"></div></div><button class="secondary" id="signoutBtn">Sign Out</button></div><div class="scores"><div class="score"><b id="todayScore">0</b>Today</div><div class="score"><b id="weekScore">0</b>This Week</div><div class="score"><b id="seasonScore">0</b>Season</div></div><div class="tabs"><button class="tab active" data-tab="tracker">Point Tracker</button><button class="tab" data-tab="history">Weekly Breakdown</button><button class="tab" data-tab="leaderboard">Leaderboard</button></div></section>
<div id="tracker"><div id="sections"></div></div>
<section id="history" class="card hidden"><div class="historyNav"><button class="secondary" id="prevWeek">← Previous</button><strong id="weekTitle">This Week</strong><button class="secondary" id="nextWeek">Next →</button></div><div class="filters"><select id="agentFilter" class="field"><option value="me">My Entries</option></select></div><div id="historyBody"></div></section>
<section id="leaderboard" class="card hidden"><h2 style="margin-top:0">League Leaderboard</h2><div class="tabs"><button class="tab active" data-board="teams">Teams</button><button class="tab" data-board="agents">Individuals</button></div><div id="teamBoard"></div><div id="agentBoard" class="hidden"><table class="leader"><thead><tr><th>#</th><th>Agent</th><th>Team</th><th class="right">Week</th><th class="right">Season</th></tr></thead><tbody id="leaderRows"></tbody></table></div></section></div>
<div id="editModal" class="modal hidden"><div class="modalBox"><h3 style="margin-top:0">Edit Point Entry</h3><div id="editActivity" class="name"></div><label>Date<input id="editDate" class="field" type="date"></label><label>Quantity<input id="editQty" class="field" type="number" min="1" max="99"></label><div class="modalBtns"><button class="secondary" id="cancelEdit">Cancel</button><button class="primary" id="saveEdit">Save Changes</button></div></div></div>
</main><script>
(()=>{'use strict';
const URL='https://pruvydksuuazckyttvnq.supabase.co';
const KEY='sb_publishable_KyNM7mzl5JX5p6i1jUsibA_d5-8Seg9';
const $=id=>document.getElementById(id);
const el={auth:$('authBox'),app:$('app'),name:$('displayName'),email:$('emailInput'),pw:$('passwordInput'),signin:$('signinBtn'),signup:$('signupBtn'),msg:$('authMsg'),signout:$('signoutBtn'),welcome:$('welcome'),sections:$('sections'),today:$('todayScore'),week:$('weekScore'),season:$('seasonScore'),leaderboard:$('leaderboard'),tracker:$('tracker'),leaderRows:$('leaderRows'),history:$('history'),historyBody:$('historyBody'),weekTitle:$('weekTitle'),agentFilter:$('agentFilter'),teamBoard:$('teamBoard'),agentBoard:$('agentBoard'),teamLabel:$('teamLabel'),editModal:$('editModal'),editActivity:$('editActivity'),editDate:$('editDate'),editQty:$('editQty')};
const activities=[['Deals + Everyday Plays','Double-sided closing',20],['Deals + Everyday Plays','Closing: buyer side',10],['Deals + Everyday Plays','Closing: listing side',10],['Deals + Everyday Plays','New listing signed',6],['Deals + Everyday Plays','Property under contract',6],['Deals + Everyday Plays','Buyer agreement signed',3],['Deals + Everyday Plays','Price reduction obtained',2],['Deals + Everyday Plays','Open house held',2],['Deals + Everyday Plays','New 5-star client review',3],['Deals + Everyday Plays','Training or sales meeting',1],['Referrals + Closing Bonuses','Sphere referral to CG agent',3],['Referrals + Closing Bonuses','Sphere referral under contract',5],['Referrals + Closing Bonuses','Sphere referral closes',10],['Referrals + Closing Bonuses','Closing bonus: $500K+',3],['Referrals + Closing Bonuses','Closing bonus: $750K+',5],['Referrals + Closing Bonuses','Closing bonus: $1M+',10],['Referrals + Closing Bonuses','Double-end closing bonus',5],['Referrals + Closing Bonuses','SkySlope complete before closing',3],['Social Media','Social media post',2],['Social Media','Reel or short video',3],['Social Media','Story series: 3+ frames',1],['Social Media','Live video or virtual tour',3],['Social Media','Reel: 1,000–2,499 views',2],['Social Media','Reel: 2,500–4,999 views',4],['Social Media','Reel: 5,000+ views',6],['Social Media','Qualified social media lead',5],['Social Media','Appointment from social media',8],['Hosted Events','Host client/community event',5],['Hosted Events','Qualified event referral',3],['Hosted Events','Event-sourced deal under contract',10],['Team Bonus Plays','Everyone scores in the week',5],['Team Bonus Plays','Everyone scores in the month',15],['Team Bonus Plays','3+ members close in the month',10]];
let session=null,entries=[],profiles=[],myProfile=null,weekOffset=0,editId=null;
const timeout=(p,ms=15000)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('Connection timed out after 15 seconds. Please try again.')),ms))]);
function setMsg(t,type='muted'){el.msg.textContent=t;el.msg.className='msg '+type}
function busy(v,which){el.signup.disabled=v;el.signin.disabled=v;el.signup.textContent=v&&which==='signup'?'Creating…':'Create Account';el.signin.textContent=v&&which==='signin'?'Signing in…':'Sign In'}
async function request(path,opts={}){const headers={'apikey':KEY,'Content-Type':'application/json',...(opts.auth&&session?.access_token?{'Authorization':'Bearer '+session.access_token}:{}),...(opts.headers||{})};const res=await timeout(fetch(URL+path,{...opts,headers}));let data=null;const txt=await res.text();try{data=txt?JSON.parse(txt):null}catch{data=txt}if(!res.ok)throw new Error(data?.msg||data?.message||data?.error_description||data?.error||('Request failed: '+res.status));return data}
function saveSession(s){session=s;localStorage.setItem('cg_session',JSON.stringify(s))}function clearSession(){session=null;localStorage.removeItem('cg_session')}
function localDate(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function mondayFor(offset=0){const d=new Date(),day=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day+offset*7);return d}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function buildRows(){const cats=[...new Set(activities.map(a=>a[0]))];el.sections.innerHTML='';cats.forEach(cat=>{const s=document.createElement('section');s.className='section';s.innerHTML='<h2>'+cat+'</h2>';activities.forEach((a,i)=>{if(a[0]!==cat)return;const r=document.createElement('div');r.className='row';r.innerHTML='<div><div class="name">'+a[1]+'</div><div class="pts">+'+a[2]+' points each</div></div><div class="controls"><button class="btn" data-minus="'+i+'">−</button><span class="qty" data-q="'+i+'">0</span><button class="btn plus" data-plus="'+i+'">+</button></div>';s.appendChild(r)});el.sections.appendChild(s)})}
function todayQty(i){const a=activities[i];return entries.filter(e=>e.entry_date===localDate()&&e.activity===a[1]&&e.category===a[0]&&e.points===a[2]).reduce((s,e)=>s+e.quantity,0)}
function render(){let today=0,season=0;entries.forEach(e=>{const v=e.points*e.quantity;season+=v;if(e.entry_date===localDate())today+=v});const now=new Date(),day=(now.getDay()+6)%7,start=new Date(now);start.setHours(0,0,0,0);start.setDate(now.getDate()-day);const week=entries.filter(e=>new Date(e.entry_date+'T00:00:00')>=start).reduce((s,e)=>s+e.points*e.quantity,0);el.today.textContent=today;el.week.textContent=week;el.season.textContent=season;document.querySelectorAll('[data-q]').forEach(x=>x.textContent=todayQty(+x.dataset.q))}
async function loadEntries(){entries=await request('/rest/v1/point_entries?select=*&user_id=eq.'+session.user.id+'&order=created_at.asc',{auth:true});render()}
async function loadProfiles(){profiles=await request('/rest/v1/profiles?select=id,display_name,team,is_admin&order=display_name.asc',{auth:true});myProfile=profiles.find(p=>p.id===session.user.id)||null;el.welcome.textContent=myProfile?.display_name||session.user.email;el.teamLabel.textContent=myProfile?.team?'Team: '+myProfile.team:'';el.agentFilter.innerHTML='<option value="me">My Entries</option>'+(myProfile?.is_admin?'<option value="all">All Agents</option>'+profiles.map(p=>'<option value="'+p.id+'">'+esc(p.display_name)+'</option>').join(''):'')}
async function loadLeaderboard(){const data=await request('/rest/v1/leaderboard?select=*&order=season_points.desc',{auth:true});el.leaderRows.innerHTML=(data||[]).map((r,i)=>'<tr><td>'+(i+1)+'</td><td><strong>'+esc(r.display_name)+'</strong></td><td>'+esc(r.team||'Unassigned')+'</td><td class="right">'+r.week_points+'</td><td class="right"><strong>'+r.season_points+'</strong></td></tr>').join('')||'<tr><td colspan="5">No scores yet.</td></tr>';const teams={};(data||[]).forEach(r=>{const t=r.team||'Unassigned';if(!teams[t])teams[t]={week:0,season:0,agents:[]};teams[t].week+=r.week_points;teams[t].season+=r.season_points;teams[t].agents.push(r)});el.teamBoard.innerHTML=Object.entries(teams).sort((a,b)=>b[1].season-a[1].season).map(([t,v])=>'<div class="teamCard"><div class="teamHead"><span>'+esc(t)+'</span><span>'+v.season+' season • '+v.week+' week</span></div>'+v.agents.sort((a,b)=>b.season_points-a.season_points).map(a=>'<div class="agentLine"><span>'+esc(a.display_name)+'</span><span>'+a.season_points+' pts</span></div>').join('')+'</div>').join('')||'<div class="empty">No teams yet.</div>'}
async function loadHistory(){const start=mondayFor(weekOffset),end=addDays(start,6),after=addDays(end,1);el.weekTitle.textContent=start.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' – '+end.toLocaleDateString(undefined,{month:'short',day:'numeric'});let path='/rest/v1/point_entries?select=*&entry_date=gte.'+localDate(start)+'&entry_date=lt.'+localDate(after)+'&order=entry_date.asc,created_at.asc';const f=el.agentFilter.value;if(!myProfile?.is_admin||f==='me')path+='&user_id=eq.'+session.user.id;else if(f!=='all')path+='&user_id=eq.'+f;const data=await request(path,{auth:true});let by={};data.forEach(e=>(by[e.entry_date]??=[]).push(e));let out='',total=0;for(let i=0;i<7;i++){const d=addDays(start,i),key=localDate(d),rows=by[key]||[],dt=rows.reduce((s,e)=>s+e.points*e.quantity,0);total+=dt;out+='<div class="day"><div class="dayHead"><span>'+d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+'</span><span>'+dt+' pts</span></div>';if(!rows.length)out+='<div class="empty">No activity</div>';else rows.forEach(e=>{const p=profiles.find(x=>x.id===e.user_id),can=e.user_id===session.user.id||myProfile?.is_admin;out+='<div class="entry"><div><div class="name">'+esc(e.activity)+' ×'+e.quantity+' — '+(e.points*e.quantity)+' pts</div><div class="entryMeta">'+esc(p?.display_name||'Agent')+' • '+esc(e.category)+'</div></div>'+(can?'<div class="entryActions"><button class="mini" data-edit="'+e.id+'">Edit</button><button class="mini dangerBtn" data-delete="'+e.id+'">Delete</button></div>':'')+'</div>'});out+='</div>'}el.historyBody.innerHTML='<div class="topline" style="margin-top:12px"><strong>Week Total</strong><strong>'+total+' points</strong></div>'+out}
async function openEdit(id){const rows=await request('/rest/v1/point_entries?select=*&id=eq.'+id,{auth:true}),e=rows[0];if(!e)return;editId=id;el.editActivity.textContent=e.activity+' ('+e.points+' pts each)';el.editDate.value=e.entry_date;el.editQty.value=e.quantity;el.editModal.classList.remove('hidden')}
async function saveEdit(){const q=Math.max(1,Math.min(99,parseInt(el.editQty.value)||1)),date=el.editDate.value;if(!date)return alert('Choose a date.');await request('/rest/v1/point_entries?id=eq.'+editId,{method:'PATCH',auth:true,headers:{'Prefer':'return=minimal'},body:JSON.stringify({quantity:q,entry_date:date})});el.editModal.classList.add('hidden');await loadEntries();await loadHistory();await loadLeaderboard()}
async function deleteEntry(id){if(!confirm('Delete this point entry?'))return;await request('/rest/v1/point_entries?id=eq.'+id,{method:'DELETE',auth:true});await loadEntries();await loadHistory();await loadLeaderboard()}
async function showApp(){el.auth.classList.add('hidden');el.app.classList.remove('hidden');await loadProfiles();await loadEntries();await loadLeaderboard()}
async function signup(){const email=el.email.value.trim(),password=el.pw.value,name=el.name.value.trim();if(!email||!password)return setMsg('Enter your email and password.','danger');if(password.length<6)return setMsg('Password must be at least 6 characters.','danger');busy(true,'signup');setMsg('Connecting to Supabase…');try{const data=await request('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password,data:{display_name:name||email.split('@')[0]}})});if(data?.access_token){saveSession({...data,user:data.user});setMsg('Account created!','good');await showApp()}else if(data?.user){setMsg('Account created. Please sign in.','good')}else throw new Error('Supabase did not return an account.')}catch(e){setMsg(e.message,'danger')}finally{busy(false)}}
async function signin(){const email=el.email.value.trim(),password=el.pw.value;if(!email||!password)return setMsg('Enter your email and password.','danger');busy(true,'signin');setMsg('Connecting to Supabase…');try{const data=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});saveSession({...data,user:data.user});setMsg('Signed in!','good');await showApp()}catch(e){setMsg(e.message,'danger')}finally{busy(false)}}
async function change(i,delta){const a=activities[i],date=localDate(),matches=entries.filter(e=>e.entry_date===date&&e.activity===a[1]&&e.category===a[0]&&e.points===a[2]);if(delta>0){await request('/rest/v1/point_entries',{method:'POST',auth:true,headers:{'Prefer':'return=minimal'},body:JSON.stringify({user_id:session.user.id,activity:a[1],category:a[0],points:a[2],quantity:1,entry_date:date})})}else{if(!matches.length)return;await request('/rest/v1/point_entries?id=eq.'+matches[matches.length-1].id+'&user_id=eq.'+session.user.id,{method:'DELETE',auth:true})}await loadEntries()}
el.signup.addEventListener('click',signup);el.signin.addEventListener('click',signin);el.signout.addEventListener('click',()=>{clearSession();location.reload()});
$('prevWeek').addEventListener('click',()=>{weekOffset--;loadHistory().catch(e=>alert(e.message))});$('nextWeek').addEventListener('click',()=>{weekOffset++;loadHistory().catch(e=>alert(e.message))});el.agentFilter.addEventListener('change',()=>loadHistory().catch(e=>alert(e.message)));$('cancelEdit').addEventListener('click',()=>el.editModal.classList.add('hidden'));$('saveEdit').addEventListener('click',()=>saveEdit().catch(e=>alert(e.message)));
document.addEventListener('click',async e=>{try{if(e.target.dataset.plus!==undefined)await change(+e.target.dataset.plus,1);if(e.target.dataset.minus!==undefined)await change(+e.target.dataset.minus,-1);if(e.target.dataset.edit)await openEdit(e.target.dataset.edit);if(e.target.dataset.delete)await deleteEntry(e.target.dataset.delete);if(e.target.dataset.tab){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===e.target));el.tracker.classList.toggle('hidden',e.target.dataset.tab!=='tracker');el.history.classList.toggle('hidden',e.target.dataset.tab!=='history');el.leaderboard.classList.toggle('hidden',e.target.dataset.tab!=='leaderboard');if(e.target.dataset.tab==='history')await loadHistory();if(e.target.dataset.tab==='leaderboard')await loadLeaderboard()}if(e.target.dataset.board){document.querySelectorAll('[data-board]').forEach(x=>x.classList.toggle('active',x===e.target));el.teamBoard.classList.toggle('hidden',e.target.dataset.board!=='teams');el.agentBoard.classList.toggle('hidden',e.target.dataset.board!=='agents')}}catch(err){alert(err.message)}});
buildRows();try{const saved=JSON.parse(localStorage.getItem('cg_session')||'null');if(saved?.access_token&&saved?.user){session=saved;showApp().catch(()=>{clearSession();el.auth.classList.remove('hidden');el.app.classList.add('hidden');setMsg('Session expired. Please sign in again.','danger')})}}catch{};
})();</script></body></html>
